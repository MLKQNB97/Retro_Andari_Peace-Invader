<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Buttons</title>
<style>
* {
  box-sizing: border-box;
}

body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#page {
  position: relative;
  width: 1080px;
  height: 1080px;
  background: #000;
}

#buttonRow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.lang-btn {
  position: relative;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  line-height: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.lang-btn img {
  display: block;
  width: 52px;
  height: auto;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  pointer-events: none;
}

.lang-btn .btn-blue {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  pointer-events: none;
}

.lang-btn.is-blue .btn-white {
  opacity: 0;
}

.lang-btn.is-blue .btn-blue {
  opacity: 1;
}
</style>
</head>
<body>
<div id="page">
  <div id="buttonRow">
    <button class="lang-btn" id="btnEn" type="button" aria-label="English">
      <img class="btn-white" src="WEN.png" alt="EN">
      <img class="btn-blue" src="BEN.png" alt="">
    </button>
    <button class="lang-btn" id="btnAr" type="button" aria-label="Arabic">
      <img class="btn-white" src="WAR.png" alt="AR">
      <img class="btn-blue" src="BAR.png" alt="">
    </button>
    <button class="lang-btn" id="btnKr" type="button" aria-label="Korean">
      <img class="btn-white" src="WKR.png" alt="KR">
      <img class="btn-blue" src="BKR.png" alt="">
    </button>
  </div>
</div>

<script>
const clickSound = new Audio('Interface_Click.mp3');
clickSound.preload = 'auto';

const buttons = [
  { id: 'btnEn', href: 'Final English V.html' },
  { id: 'btnAr', href: 'Final ArabicV.html' },
  { id: 'btnKr', href: 'Final Korean V.html' }
];

const LANG_SWITCH_DELAY_MS = 550;

function resetButtons() {
  buttons.forEach(({ id }) => {
    document.getElementById(id).classList.remove('is-blue');
  });
}

function playClickSound() {
  const sound = new Audio('Interface_Click.mp3');
  sound.volume = clickSound.volume;
  sound.play().catch(() => {});
}

function setupLangButton({ id, href }) {
  const btn = document.getElementById(id);

  btn.addEventListener('click', () => {
    playClickSound();
    btn.classList.add('is-blue');

    setTimeout(() => {
      resetButtons();
      window.location.href = href;
    }, LANG_SWITCH_DELAY_MS);
  });
}

resetButtons();
buttons.forEach(setupLangButton);

window.addEventListener('pageshow', resetButtons);
</script>
</body>
</html>
